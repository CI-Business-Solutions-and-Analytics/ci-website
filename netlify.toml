# Netlify configuration for CI Business Solutions and Analytics
# Static site — no build step needed; publish the repo root.

[build]
  publish = "."
  command = ""

# Sensible default security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Don't deploy local dev/preview helpers
[build.processing]
  skip_processing = false
