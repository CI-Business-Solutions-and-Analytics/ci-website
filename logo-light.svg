<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 140" role="img" aria-label="Cipro — CI Business Solutions and Analytics" style="color:#ffffff">
  <defs>
    <linearGradient id="ciGradL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82ff"/>
      <stop offset="55%" stop-color="#9061ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Wordmark: Ci prominent + pro superscript -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <text x="14" y="104" font-size="106" font-weight="800" letter-spacing="-4" fill="url(#ciGradL)">C<tspan font-style="italic">i</tspan></text>
    <text x="126" y="50" font-size="33" font-weight="700" letter-spacing="1" fill="#ffffff">pro</text>
  </g>

  <!-- Growth / continuous-improvement rising arrow (underline that lifts up) -->
  <g stroke="url(#ciGradL)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 124 H150 L190 92"/>
    <path d="M190 92 L168 93 M190 92 L188 114"/>
